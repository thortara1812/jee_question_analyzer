[project]
name = "agentic_jee_system"
version = "0.1.0"
description = "agentic_jee_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.22,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_jee_system"]

[tool.crewai]
type = "flow"
definition = "src/agentic_jee_system/flow.json"
project_id = "6c83f31a-efc4-4859-ae41-24a7bb93d675"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
