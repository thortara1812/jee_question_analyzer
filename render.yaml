services:
  - type: web
    name: agentic-jee-assistant
    runtime: python
    plan: free
    buildCommand: uv sync --locked --no-dev
    startCommand: .venv/bin/python api_server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: UV_VERSION
        value: "0.12.16"
      - key: GROQ_API_KEY
        sync: false
      - key: JEE_API_TOKEN
        sync: false
      - key: JEE_MODEL
        value: groq/openai/gpt-oss-120b
      - key: JEE_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: JEE_HISTORY_MODE
        value: session
      - key: JEE_MAX_TOKENS
        value: "900"
      - key: JEE_MIN_INTERVAL
        value: "20"
      - key: JEE_ATTEMPTS
        value: "3"
      - key: JEE_TIMEOUT
        value: "60"
      - key: JEE_JOB_TIMEOUT_SECONDS
        value: "300"
      - key: PYTHONUTF8
        value: "1"
      - key: CREWAI_TRACING_ENABLED
        value: "false"
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "true"
  - type: web
    name: agentic-jee-frontend
    runtime: python
    plan: free
    buildCommand: uv sync --locked --no-dev
    startCommand: .venv/bin/python frontend_server.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: UV_VERSION
        value: "0.12.16"
      - key: JEE_API_URL
        value: https://jee-question-analyzer.onrender.com
      - key: JEE_API_TOKEN
        sync: false
      - key: JEE_HISTORY_MODE
        value: session
